[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexiaodu"
version = "0.1.0"
description = "乐小读五日 MVP"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "numpy>=1.26,<3",
    "pytest>=8,<9",
]
ocr = [
    "numpy>=1.26,<3",
    "paddleocr==3.3.2",
    "paddlepaddle==3.2.2",
]

[project.scripts]
lexiaodu = "lexiaodu.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
