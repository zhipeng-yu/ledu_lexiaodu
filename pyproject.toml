[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexiaodu"
version = "0.1.0"
description = "乐小读 AI 顾问桌面应用"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cryptography>=45,<47",
    "openai>=1,<3",
    "PySide6>=6.8,<7",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
lexiaodu = "lexiaodu.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
